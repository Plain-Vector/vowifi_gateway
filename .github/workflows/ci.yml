name: Validate gateway
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            control/requirements.txt
            requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev swig
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q control/app engine
      - run: bash -n install.sh engine/entrypoint.sh
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  control-image:
    if: github.event_name != 'pull_request'
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build control image from source
        run: docker build --progress=plain -f control/Dockerfile -t vowifi/control:ci .
      - name: Start clean manager and verify first-run setup
        run: |
          docker run -d --name control-smoke -p 127.0.0.1:18443:8443 vowifi/control:ci
          for attempt in $(seq 1 30); do
            if curl -kfsS https://127.0.0.1:18443/api/auth/status >/dev/null; then break; fi
            sleep 2
          done
          docker exec -i control-smoke python - <<'PY'
          import json, secrets, ssl, urllib.request, urllib.error
          from http.cookiejar import CookieJar
          from pathlib import Path
          context = ssl._create_unverified_context()
          client = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(CookieJar()), urllib.request.HTTPSHandler(context=context))
          root = 'https://127.0.0.1:8443'
          status = json.load(client.open(root+'/api/auth/status'))
          assert status['configured'] is False
          try:
              client.open(root+'/api/settings')
              raise AssertionError('Anonymous settings access was allowed')
          except urllib.error.HTTPError as error:
              assert error.code == 401
          code = Path('/data/auth/setup-code').read_text().strip()
          body = json.dumps({'username':'admin','password':secrets.token_urlsafe(24),'setup_code':code}).encode()
          client.open(urllib.request.Request(root+'/api/auth/setup',data=body,headers={'Content-Type':'application/json'})).read()
          assert json.load(client.open(root+'/api/auth/status'))['authenticated']
          assert 'ntfy' in json.load(client.open(root+'/api/settings'))
          assert not Path('/data/auth/setup-code').exists()
          print('Clean container setup/login/settings smoke passed')
          PY
      - name: Container diagnostics
        if: always()
        run: docker logs control-smoke 2>/dev/null || true
  engine-image:
    if: github.event_name != 'pull_request'
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Build engine image from source
        run: docker build --progress=plain -t vowifi/engine:ci engine
      - name: Verify Asterisk and installed call-filter scripts
        run: |
          docker run --rm --entrypoint asterisk vowifi/engine:ci -V
          docker run --rm --entrypoint python3 vowifi/engine:ci -c "import sys; sys.path.insert(0,'/usr/local/bin'); import call_filter, sms_filter, blocking_match, notify; assert blocking_match.normalize('0612345678') == '+33612345678'; print('Engine imports passed')"
      - name: Test IMS precondition admission, PRACK, UPDATE and endpoint isolation
        run: docker run --rm --entrypoint python3 -v "$PWD/tests/engine_precondition_smoke.py:/tmp/engine_precondition_smoke.py:ro" vowifi/engine:ci /tmp/engine_precondition_smoke.py
      - name: Test real Asterisk SMS filtering and synthetic IMS acknowledgements
        run: docker run --rm --entrypoint python3 -v "$PWD/tests/engine_sms_smoke.py:/tmp/engine_sms_smoke.py:ro" vowifi/engine:ci /tmp/engine_sms_smoke.py
      - name: Exercise unattended fresh-server installer
        run: |
          docker tag vowifi/engine:ci vowifi/engine
          sudo env VOWIFI_PORT=18444 ./install.sh install --mode docker
          curl -kfsS https://127.0.0.1:18444/api/auth/status | python3 -c "import json,sys; assert json.load(sys.stdin)['configured'] is False"
          umask 077
          sudo ./install.sh setup-code > /tmp/vowifi-setup-code-output
          test -s /tmp/vowifi-setup-code-output
          sudo test -s data/auth/setup-code
          docker exec vowifi-control python -c "from smartcard.scard import SCardEstablishContext,SCardReleaseContext,SCARD_SCOPE_USER,SCARD_S_SUCCESS; result,context=SCardEstablishContext(SCARD_SCOPE_USER); assert result == SCARD_S_SUCCESS, hex(result); SCardReleaseContext(context); print('Pinned PCSC host/container connection passed')"
          echo "Fresh-server installer and setup-code command passed"
      - name: Installer diagnostics
        if: always()
        run: |
          docker logs vowifi-control 2>/dev/null || true
          sudo journalctl -u pcscd --no-pager -n 30 || true
